name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run pertama: project (sumber mod) ada di dalam file ini. Dibuka jadi file biasa di repo.
      - name: Unpack project
        run: |
          if [ ! -f build.gradle ]; then
            echo "" | base64 -d | tar xz
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Add mod project"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/supermod-*.jar | grep -v sources | head -n1)
          gh release delete latest --cleanup-tag -y || true
          gh release create latest "$JAR" --title "Latest build" \
            --notes "Download file .jar di bawah." --target "$(git rev-parse HEAD)"
            
